name: codeabz

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  codeabz:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /codeabz') ||
      startsWith(github.event.comment.body, '/codeabz')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run codeabz
        uses: Abdul-Basit-Zahid/codeabz/github@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          CODEABZ_API_KEY: ${{ secrets.CODEABZ_API_KEY }}
          CODEABZ_PERMISSION: '{"bash": "deny"}'
        with:
          model: codeabz/claude-opus-4-5
